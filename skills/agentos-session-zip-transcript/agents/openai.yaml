interface:
  display_name: "agentos-session-zip-transcript"
  short_description: "Resolve, extract, and compress a prior chat session into a self-described transcript artifact"
  default_prompt: "Run this skill as a separate agent by default. Given a session id, session URI, or session query, resolve the chat session with `agentos chat session`, extract its conversation, and return a compressed transcript artifact. Preserve every user turn in full. Compress every assistant turn to the shortest direct form that keeps new information. Keep short high-signal outputs verbatim only when useful; compress long structured outputs into short factual summaries instead of copying them wholesale. Drop progress narration and process chatter. Begin with an explicit notice that the artifact is compressed and not the original transcript, and include a short provenance header with the source session id, resolved URI, and the resolve/extract commands used. If resolution is ambiguous, stop and report the candidate sessions instead of guessing."
