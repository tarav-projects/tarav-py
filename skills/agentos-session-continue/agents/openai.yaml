interface:
  display_name: "session-continue"
  short_description: "Resolve a prior chat session into a continuation handoff artifact for resuming here"
  default_prompt: "Run this skill as a separate agent by default. Given a session id, session URI, or session query, resolve the chat session with `agentos chatlas`, extract its conversation, and return a continuation handoff artifact for resuming the discussion in this chat. Preserve every user turn in full and verbatim. Compress every assistant turn to the shortest direct form that keeps new information. Derive a continuation-state section that captures the current goal, accepted decisions, active constraints, important artifacts, open threads, and the recommended next step when the session supports them. Keep short high-signal outputs verbatim only when useful; compress long structured outputs into short factual summaries instead of copying them wholesale. Drop progress narration and process chatter. Begin with an explicit notice that the artifact is a continuation handoff and not the original transcript, and include a short provenance header with the source session id, resolved URI, and the resolve/extract commands used. If resolution is ambiguous, stop and report the candidate sessions instead of guessing."
