[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.1.0"
description = "Core library and CLI primitives for agentic workflows (tara-tapes, refs, mdblocks, prefix, skills)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pereiro" }]
dependencies = [
    "agentos-canvas-py",
    "jsonschema>=4.25.1",
    "jmespath>=1.0.1",
    "tara-stdlib-py",
    "rich>=13.7,<16",
]

[tool.uv.sources]
agentos-canvas-py = { path = "../canvas/agentos-canvas-py", editable = true }
tara-stdlib-py = { path = "../../tara-project/tara-project-py/packages/tara-stdlib-py", editable = true }

[project.scripts]
agentos = "agentos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.12",
]
