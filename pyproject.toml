[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.1.0"
description = "Agentos modular-monolith runtime, subsystems, and command surfaces."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "pereiro" }]
dependencies = [
    "filelock==3.20.3",
    "jsonschema>=4.25.1",
    "jmespath>=1.0.1",
    "rich>=13.7,<16",
]

[project.scripts]
agentos = "agentos.cli:main"
agentos-daemon = "agentos.daemon.entrypoint:main"
iterante = "agentos.iterante.cli:main"
iterante2 = "agentos.iterante2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.12",
]

[tool.ruff]
extend-exclude = ["_DEPRECATED"]
