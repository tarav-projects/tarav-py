[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.1.0"
description = "Python foundation library for Agentos runtime and reusable command-domain primitives."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pereiro" }]
dependencies = [
    "jsonschema>=4.25.1",
    "jmespath>=1.0.1",
    "tara-stdlib-py",
    "rich>=13.7,<16",
]

[tool.uv.sources]
tara-stdlib-py = { path = "../../tara-project/tara-project-py/packages/tara-stdlib-py", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agentos"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.12",
]
