[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "tarav"
version = "0.1.0"
description = "Tarav modular-monolith runtime, subsystems, and command surfaces."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "pereiro" }]
dependencies = [
    "filelock==3.20.3",
    "jsonschema>=4.25.1",
    "jmespath>=1.0.1",
    "rich>=13.7,<16",
    "pydantic>=2.12,<3",
]

[project.scripts]
tarav = "tarav.l3.cli:main"
tarav-daemon = "tarav.l3.daemon.entrypoint:main"
iterante = "tarav.l1.iterante.cli:main"
iterante2 = "tarav.l1.iterante2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tarav"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.12",
]

[tool.ruff]
extend-exclude = ["_DEPRECATED"]
